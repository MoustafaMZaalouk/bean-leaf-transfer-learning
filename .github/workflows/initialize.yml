name: Initialize approved source
on: [workflow_dispatch]
permissions:
  contents: write
jobs:
  initialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Initialize reviewed project once
        shell: python
        run: |
          import base64,hashlib,io,pathlib,zipfile
          if not pathlib.Path('README.md').exists():
              data=base64.b64decode(''.join(p.read_text() for p in sorted(pathlib.Path('.publish').glob('part*.txt'))))
              assert hashlib.sha256(data).hexdigest()=='9b6df91db1345f8111ad1703cb92c2c4e23d44c0937e4f28a7dae2919f9edf63'
              with zipfile.ZipFile(io.BytesIO(data)) as z:
                  for item in z.infolist():
                      path=pathlib.Path(item.filename)
                      assert not path.is_absolute() and '..' not in path.parts
                  z.extractall('.', members=[i for i in z.namelist() if not i.startswith('.github/workflows/')])
                  for item in z.infolist():
                      mode=item.external_attr >> 16
                      if mode and pathlib.Path(item.filename).exists(): pathlib.Path(item.filename).chmod(mode)
      - name: Publish source and remove one-time initializer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -r .publish
          git add -A
          git commit -m 'Publish reviewed AI-assisted bean leaf transfer project'
          git push
