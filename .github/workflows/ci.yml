name: correctness-and-smoke
on: [push, pull_request, workflow_dispatch]
jobs:
    checks:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: '3.10'
                  cache: pip
            - run: python -m pip install -r requirements.txt
            - run: make lint
            - run: make test
            - run: make smoke
